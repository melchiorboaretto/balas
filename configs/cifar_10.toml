# ===========================================================================
# DSE — Image Classification (ResNet8 do MLPerf Tiny), espaço na casa dos milhões
# ===========================================================================
# Números (python_scripts/dse/space_report.py, Monte Carlo com 30.000 amostras):
#   grid bruto ........ 10.616.832 combinações
#   distintos ......... 6.193.152 modelos (leaky_slope só conta com leaky_relu)
#   na faixa .......... ~3,24 milhões (params entre 0,3x e 3x a referência)
#   mistura estimada .. cabe nas 3 placas ~64% | em algumas ~34% | em nenhuma ~2%
#
# Referência (defaults do builder = MLPerf Tiny v1.1): 77.706 params,
# 12.501.632 MACs, pico de ativação 49.152 B. Canais 16/32/64, kernel 3,
# 1 bloco basic por estágio, strides 1/2/2, ReLU.
#
# A restrição é só de TAMANHO (params ~ flash). MACs ficam livres: latência é o
# que se mede placa a placa. A diferença entre placas vem só de memória.
# Canais em múltiplos de 4.

[experiment]
name = "dse_cifar_10"
benchmark = "cifar_ten"
base_seed = 72
profiling_samples = 10
# {target} vira nxp / stm32 / nordic (ou dryrun no --dry-run): cada placa
# tem seu próprio histórico de hashes.
output_csv = "artifacts/{target}/dse_cifar_10.csv"
output_map = "artifacts/{target}/dse_cifar_10_map.json"

[hyperparameters.grid]
# Largura de cada estágio (o stem usa a largura e o kernel do estágio 1).
channels_1 = [8, 12, 16, 24, 32, 48]
channels_2 = [16, 24, 32, 48, 64, 96]
channels_3 = [32, 48, 64, 96, 128, 192]

# Kernel das convoluções de cada estágio.
kernel_1 = [3, 5]
kernel_2 = [3, 5]
kernel_3 = [3, 5]

# Blocos residuais por estágio (2 = mais profundidade e mais um Add).
blocks_1 = [1, 2]
blocks_2 = [1, 2]
blocks_3 = [1, 2]

# Stride do primeiro bloco de cada estágio (1 mantém a resolução: mais MACs
# e mais RAM de ativação; 2 reduz a resolução pela metade).
stride_1 = [1, 2]
stride_2 = [1, 2]
stride_3 = [1, 2]

# basic = 2 convs kxk; bottleneck_2 = 1x1 (canais/2) -> kxk -> 1x1.
block_type_1 = ["basic", "bottleneck_2"]
block_type_2 = ["basic", "bottleneck_2"]
block_type_3 = ["basic", "bottleneck_2"]

# Função de ativação da rede inteira. relu/relu6 são fundidas na convolução
# (custo zero no .tflite); as outras viram operadores separados
# (LEAKY_RELU, HARD_SWISH, LOGISTIC, TANH). Na STM32 com ST Edge AI,
# sigmoid/tanh/hard_swish rodam em float32 (coluna float_fallback no CSV).
activation = ["relu", "relu6", "leaky_relu", "hard_swish", "sigmoid", "tanh"]
# Inclinação da parte negativa do leaky_relu (ignorada nas outras ativações).
leaky_slope = [0.1, 0.3]

[hyperparameters.constraints]
# params do modelo / params da referência.
params_ratio = [0.3, 3.0]

[model_specs]
input_shape = [32, 32, 3]
num_classes = 10
